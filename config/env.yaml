# 指定当前运行环境 dev / test / prod
env: test
# 开发环境 本地调试地址
dev:
  base_url: "http://127.0.0.1:8080/api/v1"
  timeout: 10
# 测试环境（脱敏域名，xxx占位）
test:
  base_url: "https://test-browser-api.xxx.com/api/v1"
  timeout: 15
# 生产线上环境
prod:
  base_url: "https://browser-api.xxx.com/api/v1"
  timeout: 20
# 所有接口通用请求头
global_headers:
  Content-Type: "application/json"
  platform: "mobile"
  app_version: "1.0.0"
